# yaml-language-server: $schema=https://taskfile.dev/schema.json

version: "3"

tasks:
  dev:
    desc: Run the TUI app in development mode
    cmd: APP_ENV=development go run ./cmd/nbx/

  build:
    desc: Build nbx with the web UI embedded
    cmds:
      - task: web:build
      - go build -o nbx cmd/nbx/main.go

  web:install:
    desc: Install the web UI dependencies
    dir: web
    cmd: pnpm install --frozen-lockfile
    sources: [package.json, pnpm-lock.yaml]

  web:build:
    desc: Build the web UI into internal/web/dist (embedded by go build)
    dir: web
    deps: [web:install]
    cmd: pnpm build

  web:dev:
    desc: Run the web UI dev server against a running daemon (nbx daemon start)
    dir: web
    deps: [web:install]
    cmd: pnpm dev

  clean:
    desc: Clean the Binary
    cmds:
      - rm ./nbx

  release:
    desc: Release the CLI binary in local
    cmds:
      - goreleaser check
      - goreleaser release --snapshot --clean

  fmt:
    desc: go fmt
    cmd: go fmt ./...

  fix:
    desc: go fix
    cmd: go fix ./...

  test:
    desc: Run all tests
    cmds:
      - go test -v ./internal/...
