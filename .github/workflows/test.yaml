name: Go Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Check go.mod is tidy
        run: go mod tidy -diff

      - name: Vet
        run: go vet ./...

      - name: Build
        run: go build -o notebox ./cmd/notebox

      - name: Run tests
        run: go test -race ./...
